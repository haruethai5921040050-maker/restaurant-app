 <script>
    // ใช้ URL Deployment ตัวล่าสุดที่คุณส่งมา
    const scriptURL = "https://script.google.com/macros/s/AKfycbwQgENx3fqOKFpYBt6_-S-2RGbVAYCLHqWMJB_mT8uyYVMFOsbboK261dw79xol9U_yow/exec";

    let allRates = [];
    let isSavingRate = false;
    let isLoadingRates = false;
    let lastLoadTime = 0;

    function safeText(value, fallback = "-") {
        if (value === null || value === undefined) return fallback;
        const text = String(value).trim();
        return (!text || text === "undefined" || text === "null")
            ? fallback
            : text;
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function(char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[char];
        });
    }

    function switchTab(tabName) {
        document.querySelectorAll(".tab-content").forEach(function(el) {
            el.classList.remove("active");
        });

        document.querySelectorAll(".sidebar-menu li").forEach(function(el) {
            el.classList.remove("active");
        });

        const tab = document.getElementById("tab-" + tabName);
        const menu = document.getElementById("menu-" + tabName);

        if (tab) tab.classList.add("active");
        if (menu) menu.classList.add("active");

        if (tabName === "list") filterTable();
    }

    // โหลดข้อมูลโดยไม่เรียกซ้ำซ้อน
    async function loadData(force = false) {
        if (isLoadingRates) return false;

        // ป้องกันการโหลดติด ๆ กันเกินไป
        if (!force && Date.now() - lastLoadTime < 3000) {
            return true;
        }

        isLoadingRates = true;

        try {
            const url = scriptURL + "?_=" + Date.now();

            const response = await fetch(url, {
                method: "GET",
                cache: "no-store",
                redirect: "follow"
            });

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            const data = await response.json();

            if (!data || data.status === "error" ||
                !Array.isArray(data.rates)) {
                throw new Error(data?.message || "รูปแบบข้อมูลไม่ถูกต้อง");
            }

            allRates = data.rates;
            lastLoadTime = Date.now();

            filterTable();
            return true;

        } catch (error) {
            console.error("โหลดข้อมูลไม่สำเร็จ:", error);

            if (allRates.length === 0) {
                document.getElementById("rateTableBody").innerHTML =
                    '<tr><td colspan="9" style="text-align:center;padding:30px;color:#b91c1c;">' +
                    'โหลดข้อมูลไม่ได้ กรุณาตรวจสอบ URL และการ Deploy ของ Apps Script' +
                    '</td></tr>';

                document.getElementById("recordCount").innerText =
                    "โหลดข้อมูลไม่สำเร็จ";
            }

            return false;

        } finally {
            isLoadingRates = false;
        }
    }

    // บันทึกข้อมูลใหม่
    async function addNewRate() {
        if (isSavingRate) return;

        const client = document.getElementById("newClient").value.trim();
        const project = document.getElementById("newProject").value.trim();
        const location = document.getElementById("newLocation").value.trim();
        const fuelRange = document.getElementById("newFuel").value;
        const priceInput = document.getElementById("newPriceVal").value;
        const price = Number(priceInput);
        const unit = document.getElementById("newUnit").value;
        const recorder = document.getElementById("newRecorder").value;
        const mapLink = document.getElementById("newMapLink").value.trim();

        if (!client || !project || !location ||
            priceInput === "" || !Number.isFinite(price) || price < 0) {
            alert("กรุณากรอกผู้ว่าจ้าง วัสดุ จุดลง และราคางานให้ถูกต้องครับ");
            return;
        }

        if (mapLink) {
            try {
                const parsed = new URL(mapLink);
                if (parsed.protocol !== "https:" && parsed.protocol !== "http:") {
                    throw new Error("ลิงก์ไม่ถูกต้อง");
                }
            } catch (error) {
                alert("กรุณาตรวจสอบลิงก์ Google Maps ครับ");
                return;
            }
        }

        const payload = {
            action: "add_rate",
            client: client,
            project: project,
            location: location,
            fuelRange: fuelRange,
            price: price,
            unit: unit,
            recorder: recorder,
            mapLink: mapLink
        };

        const button = document.getElementById("saveRateButton");
        isSavingRate = true;
        button.disabled = true;
        button.innerText = "กำลังบันทึก...";

        try {
            /*
             * หมายเหตุ: no-cors ทำให้เบราว์เซอร์อ่านผลตอบกลับ POST ไม่ได้
             * จึงตรวจสอบรายการจาก GET หลังส่งคำขอ
             */
            await fetch(scriptURL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(payload)
            });

            // ตรวจสอบข้อมูลจากเซิร์ฟเวอร์หลายครั้ง โดยเว้นระยะสั้น ๆ
            let savedRecord = null;

            for (let attempt = 0; attempt < 4; attempt++) {
                await new Promise(function(resolve) {
                    setTimeout(resolve, attempt === 0 ? 700 : 1000);
                });

                const loaded = await loadData(true);

                if (loaded) {
                    savedRecord = allRates.find(function(item) {
                        return String(item.client || "").trim() === client &&
                            String(item.project || "").trim() === project &&
                            String(item.location || "").trim() === location &&
                            Number(item.price) === price &&
                            String(item.unit || "").trim() === unit &&
                            String(item.recorder || "").trim() === recorder;
                    });

                    if (savedRecord) break;
                }
            }

            if (!savedRecord) {
                alert(
                    "ยังยืนยันผลบันทึกจากหน้าเว็บไม่ได้ครับ\n\n" +
                    "กรุณาตรวจสอบ Google Sheets ชีต rates ก่อนกดบันทึกซ้ำ " +
                    "เพื่อป้องกันรายการซ้ำ"
                );
                return;
            }

            alert("บันทึกข้อมูลและพบรายการในระบบแล้วครับ");

            document.getElementById("newClient").value = "";
            document.getElementById("newProject").value = "";
            document.getElementById("newLocation").value = "";
            document.getElementById("newMapLink").value = "";
            document.getElementById("newPriceVal").value = "";
            document.getElementById("newUnit").selectedIndex = 0;
            document.getElementById("newRecorder").selectedIndex = 0;
            document.getElementById("searchInput").value = "";

            filterTable();
            switchTab("list");

        } catch (error) {
            console.error("บันทึกไม่สำเร็จ:", error);

            alert(
                "เกิดปัญหาในการส่งคำขอบันทึกครับ\n\n" +
                "กรุณาตรวจสอบ Google Sheets ก่อนลองบันทึกซ้ำ"
            );

        } finally {
            isSavingRate = false;
            button.disabled = false;
            button.innerText = "บันทึกเรทราคาใหม่";
        }
    }

    // แปลงวันที่ให้รองรับทั้งวันที่แบบข้อความและ Date
    function formatDate(dateValue) {
        if (dateValue === null || dateValue === undefined ||
            dateValue === "") {
            return "-";
        }

        const text = String(dateValue).trim();

        // Apps Script เวอร์ชันที่ให้ไว้ส่งวันที่เป็น dd/MM/yyyy HH:mm:ss
        const thaiDate = text.match(
            /^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2})(?::(\d{2}))?)?$/
        );

        if (thaiDate) {
            return thaiDate[1] + "/" + thaiDate[2] + "/" + thaiDate[3] +
                (thaiDate[4] ? " " + thaiDate[4] + ":" + thaiDate[5] +
                (thaiDate[6] ? ":" + thaiDate[6] : "") : "");
        }

        const date = new Date(dateValue);

        if (isNaN(date.getTime())) return text;

        const day = String(date.getDate()).padStart(2, "0");
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const year = date.getFullYear();
        const hours = String(date.getHours()).padStart(2, "0");
        const minutes = String(date.getMinutes()).padStart(2, "0");

        return day + "/" + month + "/" + year + " " + hours + ":" + minutes;
    }

    function renderTable(data) {
        const tbody = document.getElementById("rateTableBody");

        document.getElementById("recordCount").innerText =
            "ทั้งหมด " + data.length + " รายการ";

        if (!data.length) {
            tbody.innerHTML =
                '<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--text-muted);">' +
                'ไม่พบข้อมูลเรทราคางานในระบบ</td></tr>';
            return;
        }

        tbody.innerHTML = data.map(function(item) {
            const client = escapeHTML(safeText(item.client));
            const project = escapeHTML(safeText(item.project));
            const location = escapeHTML(safeText(item.location));
            const fuelRange = escapeHTML(safeText(item.fuelRange));

            const price = Number(item.price);
            const priceText = Number.isFinite(price)
                ? price.toLocaleString("th-TH")
                : "0";

            const unit = escapeHTML(safeText(item.unit, "พ่วง"));
            const recorder = escapeHTML(safeText(item.recorder, "ปลา"));

            const rawMapLink = safeText(item.mapLink, "");
            let mapButton = '<span style="color:var(--text-muted);">-</span>';

            if (rawMapLink) {
                try {
                    const parsed = new URL(rawMapLink);

                    if (parsed.protocol === "https:" ||
                        parsed.protocol === "http:") {
                        mapButton =
                            '<a href="' + escapeHTML(parsed.href) +
                            '" target="_blank" rel="noopener noreferrer" class="map-link-btn">' +
                            '📍 ดูแผนที่</a>';
                    }
                } catch (error) {
                    console.warn("ลิงก์แผนที่ไม่ถูกต้อง:", rawMapLink);
                }
            }

            const dateText = escapeHTML(
                formatDate(item.date || item.createdAt || "")
            );

            return '<tr>' +
                '<td><b>' + client + '</b></td>' +
                '<td>' + project + '</td>' +
                '<td>' + location + '</td>' +
                '<td>' + fuelRange + '</td>' +
                '<td style="color:var(--primary);font-weight:700;">' +
                    priceText + ' บาท</td>' +
                '<td><span class="unit-badge">' + unit + '</span></td>' +
                '<td><span class="recorder-badge">👤 ' + recorder + '</span></td>' +
                '<td>' + mapButton + '</td>' +
                '<td style="color:var(--text-muted);font-size:0.85rem;">' +
                    dateText + '</td>' +
                '</tr>';
        }).join("");
    }

    function filterTable() {
        const input = document.getElementById("searchInput");
        const keyword = input.value.trim().toLocaleLowerCase("th");

        const filtered = allRates.filter(function(item) {
            return [
                item.id,
                item.client,
                item.project,
                item.location,
                item.fuelRange,
                item.price,
                item.unit,
                item.recorder,
                item.mapLink,
                item.date
            ].some(function(value) {
                return String(value ?? "")
                    .toLocaleLowerCase("th")
                    .includes(keyword);
            });
        });

        renderTable(filtered);
    }

    // โหลดครั้งแรก และซิงก์ทุก 30 วินาทีแทนทุก 10 วินาที
    loadData(true);
    setInterval(function() {
        if (!isSavingRate && !document.hidden) {
            loadData();
        }
    }, 30000);
</script>
